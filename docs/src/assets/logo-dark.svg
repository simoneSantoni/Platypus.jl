<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
  <!-- Stylized platypus in the official Julia colors -->
  <!-- Julia palette: blue #4063D8, green #389826, red #CB3C33, purple #9558B2 -->

  <!-- background -->
  <rect x="0" y="0" width="520" height="380" rx="32" fill="#2D2D30"/>

  <!-- tail (Julia green) -->
  <ellipse cx="130" cy="210" rx="92" ry="60" fill="#389826"
           transform="rotate(-20 130 210)"/>

  <!-- webbed feet (Julia blue) -->
  <path d="M 195 265 L 175 352 Q 188 343 201 352 Q 214 343 227 352 L 235 270 Z"
        fill="#4063D8"/>
  <path d="M 320 270 L 300 360 Q 314 351 328 360 Q 342 351 356 360 L 365 272 Z"
        fill="#4063D8"/>

  <!-- body (Julia purple) -->
  <ellipse cx="285" cy="195" rx="150" ry="108" fill="#9558B2"/>

  <!-- belly highlight -->
  <ellipse cx="292" cy="240" rx="102" ry="62" fill="#B98FD6"/>

  <!-- bill (Julia red) -->
  <path d="M 395 148 C 470 132, 516 162, 516 196 C 516 230, 470 260, 395 244
           C 372 215, 372 177, 395 148 Z" fill="#CB3C33"/>
  <ellipse cx="497" cy="190" rx="9" ry="7" fill="#7A2420"/>

  <!-- eye -->
  <circle cx="403" cy="151" r="24" fill="#FFFFFF"/>
  <circle cx="410" cy="150" r="12" fill="#2B2B2B"/>
  <circle cx="404" cy="144" r="4.5" fill="#FFFFFF"/>

  <!-- water bubbles, one per Julia color -->
  <circle cx="468" cy="92"  r="14" fill="#4063D8"/>
  <circle cx="503" cy="58"  r="10" fill="#389826"/>
  <circle cx="436" cy="50"  r="9"  fill="#9558B2"/>
  <circle cx="491" cy="120" r="6"  fill="#CB3C33"/>
</svg>
